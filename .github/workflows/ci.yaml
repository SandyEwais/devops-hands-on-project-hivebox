name: HiveBox CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Linting
  # -------------------------------------------------------------
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          install-mode: "goinstall"
          args: --timeout=5m

  # -------------------------------------------------------------
  # Job 2: Unit Testing
  # -------------------------------------------------------------
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Tests with Race Detector
        env:
            BOX_ID1: ${{ secrets.BOX_ID1 }}
            BOX_ID2: ${{ secrets.BOX_ID2 }}
            BOX_ID3: ${{ secrets.BOX_ID3 }}
        run: go test -v -race ./...

  # -------------------------------------------------------------
  # Job 3: Docker Build Verification
  # -------------------------------------------------------------
  build-docker:
    name: Build Docker Image
    needs: [lint, test] # Only runs if linting and tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (No Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hivebox:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max